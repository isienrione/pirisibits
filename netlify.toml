[build]
  base = "chronowalk"
  command = "VITE_BUILD_ID=\"${COMMIT_REF:-$GITHUB_SHA}\" npm run build"
  publish = "dist"

# SPA client routes (/landing, /journey, /map, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production must deploy the figma branch until it merges to main — Netlify UI:
# Site configuration → Build & deploy → Continuous deployment → Production branch = figma
[context.production.environment]
  VITE_MEDIA_BASE = ""

# Figma branch preview builds (same media base as production)
[context.figma.environment]
  VITE_MEDIA_BASE = ""
