    <title>ChronoWalk · Self-guided Rome walks</title>
    <style>
      html,
      body {
        margin: 0;
        /* Match intro cinematic letterbox so the open doesn’t flash warm charcoal. */
        background: #050505;
        color: #f5efe3;
      }
    </style>
    <script>
      ;(function () {
        var RESET_KEY = 'cw-needs-shell-reset'
        var BOOT_RELOAD_KEY = 'cw-boot-reload'
        var SKIP_SW_KEY = 'cw-skip-sw-once'
        var RESET_AT_KEY = 'cw-shell-reset-at'
        var PURGE_RELOAD_KEY = 'cw-sw-purge-reload'
        var ASSET_FAIL_KEY = 'cw-asset-fail-purge'

        function markSkipSw() {
          try {
            localStorage.setItem(SKIP_SW_KEY, '1')
          } catch (e) {}
        }

        function clearCachesAndWorkers() {
          var jobs = []
          if ('caches' in window) {
            jobs.push(
              caches.keys().then(function (names) {
                return Promise.all(
                  names.map(function (name) {
                    return caches.delete(name)
                  }),
                )
              }),
            )
          }
          if ('serviceWorker' in navigator) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  regs.map(function (reg) {
                    return reg.unregister()
                  }),
                )
              }),
            )
          }
          return Promise.all(jobs)
        }

        // ROOT CAUSE FIX: if a service worker still controls this tab, module
        // scripts can receive HTML (SPA fallback) and React never mounts.
        // Kill SW/caches and reload once before any /assets module runs.
        try {
          if (
            'serviceWorker' in navigator &&
            navigator.serviceWorker.controller &&
            sessionStorage.getItem(PURGE_RELOAD_KEY) !== '1'
          ) {
            sessionStorage.setItem(PURGE_RELOAD_KEY, '1')
            markSkipSw()
            clearCachesAndWorkers()
              .catch(function () {})
              .then(function () {
                window.location.reload()
              })
            return
          }
        } catch (e) {}

        // Best-effort: drop registrations so a later navigation cannot reclaim
        // a poisoned worker. Do not block boot.
        try {
          clearCachesAndWorkers().catch(function () {})
        } catch (e2) {}

        try {
          var params = new URLSearchParams(window.location.search || '')
          if (params.get('cw_clean') === '1') {
            localStorage.removeItem(RESET_KEY)
            localStorage.removeItem(RESET_AT_KEY)
            localStorage.setItem(SKIP_SW_KEY, '1')
            sessionStorage.removeItem(BOOT_RELOAD_KEY)
            sessionStorage.removeItem(PURGE_RELOAD_KEY)
            sessionStorage.removeItem(ASSET_FAIL_KEY)
            sessionStorage.setItem('cw-boot-hang-redirect', '1')
            sessionStorage.removeItem('cw-chunk-reload')
            if (window.history && window.history.replaceState) {
              params.delete('cw_clean')
              var next = window.location.pathname
              var q = params.toString()
              window.history.replaceState(null, '', next + (q ? '?' + q : ''))
            }
          }
        } catch (e) {}

        try {
          if (localStorage.getItem(RESET_KEY) === '1') {
            localStorage.removeItem(RESET_KEY)
            markSkipSw()
          }
        } catch (e) {}

        window.addEventListener(
          'error',
          function (event) {
            var target = event.target
            if (!target || target.tagName !== 'SCRIPT' || !target.src) return
            try {
              var srcUrl = new URL(target.src, window.location.href)
              if (srcUrl.origin !== window.location.origin) return
              if (srcUrl.pathname.indexOf('/assets/') !== 0) return
            } catch (parseErr) {
              return
            }

            // Chrome iOS keeps its own SW/cache separate from Safari. One more
            // denylisted wipe often clears it; if not, site-data clear is required.
            try {
              if (sessionStorage.getItem(ASSET_FAIL_KEY) !== '1') {
                sessionStorage.setItem(ASSET_FAIL_KEY, '1')
                sessionStorage.removeItem(PURGE_RELOAD_KEY)
                sessionStorage.removeItem(BOOT_RELOAD_KEY)
                markSkipSw()
                clearCachesAndWorkers()
                  .catch(function () {})
                  .then(function () {
                    window.location.replace('/rome/reset-shell?force=1&cw_bust=' + Date.now())
                  })
                return
              }
            } catch (err) {
              // fall through to manual instructions
            }

            var hint = document.getElementById('cw-boot-hint')
            if (hint) {
              hint.innerHTML =
                'Chrome still has an old ChronoWalk copy on this phone.<br/><a href="/rome/reset-shell?force=1" style="color:inherit">Refresh app shell</a><br/><span style="display:inline-block;margin-top:0.75rem;opacity:0.85;font-size:0.9rem;font-weight:400">If that fails: tap the lock icon by the URL → Cookies and site data → clear for chronowalk.com → then open chronowalk.com/landing</span>'
            }
          },
          true,
        )
      })()
    </script>
  </head>
  <body style="margin: 0; background: #16130f; color: #f5efe3">
    <div id="root">
      <p
        id="cw-boot-hint"
        style="
          margin: 0;
          padding: 2.5rem 1.5rem;
          font: 500 1rem/1.5 system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
          text-align: center;
        "
      >
        Loading ChronoWalk…
        <br />
        <a
          href="/rome/reset-shell?force=1"
          style="
            display: inline-block;
            margin-top: 1rem;
            color: inherit;
            opacity: 0.75;
            font-size: 0.9rem;
            font-weight: 400;
          "
          >Stuck? Refresh app shell</a
        >
      </p>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Lemon.js is loaded on demand from src/lib/lemonSqueezy.js at checkout -
         do not put it here. A failed third-party script must never trigger
         shell-reset recovery or "could not finish loading". -->
    <script>
      ;(function () {
        var hint = document.getElementById('cw-boot-hint')
        var hasController =
          'serviceWorker' in navigator && Boolean(navigator.serviceWorker.controller)
        var hangMs = hasController ? 4000 : 12000

        window.setTimeout(function () {
          if (!hint || !document.getElementById('cw-boot-hint')) return
          hint.innerHTML =
            'ChronoWalk is taking longer than usual.<br/><a href="/rome/reset-shell?force=1" style="color:inherit">Refresh app shell</a><br/><span style="opacity:0.85;font-size:0.9rem">Chrome: lock icon → Cookies and site data → clear chronowalk.com, then open /landing</span>'
        }, hangMs)
      })()
    </script>
  </body>
