    <style>

        background: #050505;
        color: #f5efe3;
      }
    </style>
    <script>
      ;(function () {
        var RESET_KEY = 'cw-needs-shell-reset'
        var BOOT_RELOAD_KEY = 'cw-boot-reload'
        var SKIP_SW_KEY = 'cw-skip-sw-once'
        var RESET_AT_KEY = 'cw-shell-reset-at'
        var COOLDOWN_MS = 2 * 60 * 1000
        // Under /rome/ so older service workers (denylist /^\/rome\//) cannot
        // intercept and re-serve the poisoned SPA shell.
        var RESET_PATH = '/rome/reset-shell.html'

        function markSkipSw() {
          try {
            localStorage.setItem(SKIP_SW_KEY, '1')
          } catch (e) {}
        }

        function recentlyReset() {
          try {
            var last = parseInt(localStorage.getItem(RESET_AT_KEY) || '0', 10)
            return last && Date.now() - last < COOLDOWN_MS
          } catch (e) {
            return false
          }
        }

        function goResetShell() {
          window.location.replace(RESET_PATH + '?cw_bust=' + Date.now())
        }

        function clearCachesAndWorkers() {
          var jobs = []
          if ('caches' in window) {
            jobs.push(
              caches.keys().then(function (names) {
                return Promise.all(
                  names.map(function (name) {
                    return caches.delete(name)
                  }),
                )
              }),
            )
          }
          if ('serviceWorker' in navigator) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  regs.map(function (reg) {
                    return reg.unregister()
                  }),
                )
              }),
            )
          }
          return Promise.all(jobs)
        }

        // Never use document.write here — Mobile Safari renders the rest of the
        // inline script as visible text. Just bounce to the static reset page.
        try {
          if (localStorage.getItem(RESET_KEY) === '1') {
            localStorage.removeItem(RESET_KEY)
            markSkipSw()
            // Cooldown: stay on this document and boot instead of looping.
            if (recentlyReset()) return
            goResetShell()
            return
          }
        } catch (e) {}

        window.addEventListener(
          'error',
          function (event) {
            var target = event.target
            if (!target || target.tagName !== 'SCRIPT' || !target.src) return
            try {
              if (sessionStorage.getItem(BOOT_RELOAD_KEY)) return
              if (recentlyReset()) return
              sessionStorage.setItem(BOOT_RELOAD_KEY, '1')
            } catch (err) {
              return
            }
            markSkipSw()
            try {
              localStorage.setItem(RESET_KEY, '1')
            } catch (err2) {}
            clearCachesAndWorkers().then(goResetShell).catch(goResetShell)
          },
          true,
        )
      })()
    </script>

    <script>
      ;(function () {
        var hint = document.getElementById('cw-boot-hint')
        window.setTimeout(function () {
          if (!hint || !document.getElementById('cw-boot-hint')) return
          hint.textContent =
            'ChronoWalk is taking longer than usual. Try refreshing, or open this page in a private tab.'
        }, 12000)
      })()
