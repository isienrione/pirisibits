<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa/icon-192.png" sizes="192x192" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#16130F" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16130F" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="ChronoWalk — GPS-guided walking tours of Rome with place-aware audio and historical reveals." />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ChronoWalk" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>ChronoWalk</title>
    <style>
      html,
      body {
        margin: 0;
        background: #16130f;
        color: #f5efe3;
      }

      #root:empty::before {
        content: 'Loading ChronoWalk…';
        display: block;
        padding: 2.5rem 1.5rem;
        font: 500 1rem/1.5 system-ui, -apple-system, sans-serif;
        text-align: center;
      }
    </style>
    <script>
      ;(function () {
        var key = 'cw-boot-reload'
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target
            if (!target || target.tagName !== 'SCRIPT' || !target.src || sessionStorage.getItem(key)) return
            sessionStorage.setItem(key, '1')
            var reload = function () {
              window.location.reload()
            }
            var jobs = []
            if ('caches' in window) {
              jobs.push(
                caches.keys().then(function (names) {
                  return Promise.all(names.map(function (name) { return caches.delete(name) }))
                }),
              )
            }
            if ('serviceWorker' in navigator) {
              jobs.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (reg) { return reg.unregister() }))
                }),
              )
            }
            Promise.all(jobs).then(reload).catch(reload)
          },
          true,
        )
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
