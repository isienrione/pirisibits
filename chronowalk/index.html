    <title>ChronoWalk · Self-guided Rome walks</title>
    <style>
      html,
      body {
        margin: 0;
        /* Match intro cinematic letterbox so the open doesn’t flash warm charcoal. */
        background: #050505;
        color: #f5efe3;
      }
    </style>
    <script>
      ;(function () {
        var RESET_KEY = 'cw-needs-shell-reset'
        var BOOT_RELOAD_KEY = 'cw-boot-reload'
        var SKIP_SW_KEY = 'cw-skip-sw-once'
        var RESET_AT_KEY = 'cw-shell-reset-at'
        var COOLDOWN_MS = 2 * 60 * 1000
        // Under /rome/ so older service workers (denylist /^\/rome\//) cannot
        // intercept and re-serve the poisoned SPA shell.
        var RESET_PATH = '/rome/reset-shell'

        var OPEN_PATH = '/rome/open'

        function markSkipSw() {
          try {
            localStorage.setItem(SKIP_SW_KEY, '1')
          } catch (e) {}
        }

        function recentlyReset() {
          try {
            var last = parseInt(localStorage.getItem(RESET_AT_KEY) || '0', 10)
            return last && Date.now() - last < COOLDOWN_MS
          } catch (e) {
            return false
          }
        }

        function goResetShell() {
          window.location.replace(RESET_PATH + '?cw_bust=' + Date.now())
        }

        function clearCachesAndWorkers() {
          var jobs = []
          if ('caches' in window) {
            jobs.push(
              caches.keys().then(function (names) {
                return Promise.all(
                  names.map(function (name) {
                    return caches.delete(name)
                  }),
                )
              }),
            )
          }
          if ('serviceWorker' in navigator) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  regs.map(function (reg) {
                    return reg.unregister()
                  }),
                )
              }),
            )
          }
          return Promise.all(jobs)
        }

        // Never use document.write here — Mobile Safari renders the rest of the
        // inline script as visible text. Just bounce to the static reset page.
        try {
          // Fresh start after a clean open - drop recovery flags that keep
          // showing "could not finish loading" on every /landing visit.
          var params = new URLSearchParams(window.location.search || '')
          if (params.get('cw_clean') === '1') {
            localStorage.removeItem(RESET_KEY)
            localStorage.removeItem(RESET_AT_KEY)
            localStorage.removeItem(SKIP_SW_KEY)
            sessionStorage.removeItem(BOOT_RELOAD_KEY)
            sessionStorage.removeItem('cw-boot-hang-redirect')
            sessionStorage.removeItem('cw-chunk-reload')
            if (window.history && window.history.replaceState) {
              params.delete('cw_clean')
              var next = window.location.pathname
              var q = params.toString()
              window.history.replaceState(null, '', next + (q ? '?' + q : ''))
            }
          }
        } catch (e) {}

        try {
          if (localStorage.getItem(RESET_KEY) === '1') {
            localStorage.removeItem(RESET_KEY)
            markSkipSw()
            // Cooldown: stay on this document and boot instead of looping.
            if (recentlyReset()) return
            goResetShell()
            return
          }
        } catch (e) {}

        // Belt-and-suspenders: after a shell wipe we set cw-skip-sw-once. If this
        // document is STILL controlled, do not evaluate modules under the poison
        // controller - send them to the denylisted open page (plain link to /landing).
        try {
          if (
            localStorage.getItem(SKIP_SW_KEY) === '1' &&
            'serviceWorker' in navigator &&
            navigator.serviceWorker.controller
          ) {
            window.location.replace(OPEN_PATH + '?cw_bust=' + Date.now())
            return
          }
        } catch (e) {}

        window.addEventListener(
          'error',
          function (event) {
            var target = event.target
            if (!target || target.tagName !== 'SCRIPT' || !target.src) return
            // Only recover for our app modules. Third-party scripts (Lemon, analytics)
            // must NOT trigger reset-shell / "could not finish loading" loops.
            try {
              var srcUrl = new URL(target.src, window.location.href)
              if (srcUrl.origin !== window.location.origin) return
              if (srcUrl.pathname.indexOf('/assets/') !== 0) return
            } catch (parseErr) {
              return
            }
            try {
              if (sessionStorage.getItem(BOOT_RELOAD_KEY)) return
              // Never auto-bounce into open/reset after a recent wipe - that loop
              // made "Open ChronoWalk" look broken. Stay and show a real link.
              if (recentlyReset()) {
                var hint = document.getElementById('cw-boot-hint')
                if (hint) {
                  hint.innerHTML =
                    'ChronoWalk could not finish loading.<br/><a href="/landing?cw_clean=1" style="color:inherit">Open ChronoWalk</a>'
                }
                return
              }
              sessionStorage.setItem(BOOT_RELOAD_KEY, '1')
            } catch (err) {
              return
            }
            markSkipSw()
            try {
              localStorage.setItem(RESET_KEY, '1')
            } catch (err2) {}
            clearCachesAndWorkers().then(goResetShell).catch(goResetShell)
          },
          true,
        )
      })()
    </script>
  </head>
  <body style="margin: 0; background: #16130f; color: #f5efe3">
    <div id="root">
      <p
        id="cw-boot-hint"
        style="
          margin: 0;
          padding: 2.5rem 1.5rem;
          font: 500 1rem/1.5 system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
          text-align: center;
        "
      >
        Loading ChronoWalk…
        <br />
        <a
          href="/landing?cw_clean=1"
          style="
            display: inline-block;
            margin-top: 1rem;
            color: inherit;
            opacity: 0.75;
            font-size: 0.9rem;
            font-weight: 400;
          "
          >Open ChronoWalk</a
        >
      </p>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Lemon.js is loaded on demand from src/lib/lemonSqueezy.js at checkout -
         do not put it here. A failed third-party script must never trigger
         shell-reset recovery or "could not finish loading". -->
    <script>
      ;(function () {
        // If React never mounts, show a real link. Do NOT auto-redirect to
        // /rome/open or reset-shell - that bounce loop made buttons look dead
        // after travelers already cleared site data.
        var hint = document.getElementById('cw-boot-hint')
        var hasController =
          'serviceWorker' in navigator && Boolean(navigator.serviceWorker.controller)
        var hangMs = hasController ? 5000 : 15000

        window.setTimeout(function () {
          if (!hint || !document.getElementById('cw-boot-hint')) return
          hint.innerHTML =
            'ChronoWalk is taking longer than usual.<br/><a href="/landing?cw_clean=1" style="color:inherit">Open ChronoWalk</a>'
        }, hangMs)
      })()
    </script>
  </body>
