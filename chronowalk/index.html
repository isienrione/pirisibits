    <style>
      html,

        background: #050505;
        color: #f5efe3;
      }
    </style>
    <script>
      ;(function () {
        // IMPORTANT: do not navigate, reload, or clear caches here.
        // Aggressive recovery (reset-shell redirects, mid-boot cache deletes)
        // trapped Chrome iOS in loops while Safari could already load /landing.
        try {
          var params = new URLSearchParams(window.location.search || '')
          if (params.get('cw_clean') === '1') {
            localStorage.removeItem('cw-needs-shell-reset')
            localStorage.removeItem('cw-shell-reset-at')
            localStorage.setItem('cw-skip-sw-once', '1')
            sessionStorage.removeItem('cw-boot-reload')
            sessionStorage.removeItem('cw-boot-pending')
            sessionStorage.removeItem('cw-chunk-reload')
            if (window.history && window.history.replaceState) {
              params.delete('cw_clean')
              var next = window.location.pathname
              var q = params.toString()
              window.history.replaceState(null, '', next + (q ? '?' + q : ''))
            }
          }
        } catch (e) {}

        // Quietly drop any SW registration without blocking module load.
        // Never delete Cache Storage during boot - that raced Chrome module fetches.
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) {
                reg.unregister()
              })
            })
          }
        } catch (e2) {}
      })()
    </script>
