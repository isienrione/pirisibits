    <!-- Google Ads Consent Mode v2 defaults BEFORE gtag.js (ads denied; analytics granted).
         Conversion ID / labels come from VITE_GOOGLE_ADS_* via src/lib/googleAds.js. -->
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'granted',
        wait_for_update: 500,
      })
    </script>
    <script>
      ;(function () {
        // Boot rules (learned the hard way — Safari OK, Chrome iOS not):
        // - Never auto-send people to /rome/reset-shell or /rome/open (blink loops).
        // - Never delete Cache Storage during boot (races Chrome module fetches).
        // - Never auto-navigate / reload the document (PR #214: that WAS the Chrome loop).
        // - Quietly unregister any SW; if React never mounts, show a manual escape.
        // Chrome on iOS keeps site data separate from Safari, so a poisoned SW in
        // Chrome does not affect Safari.
        var SKIP_SW_KEY = 'cw-skip-sw-once'

        function isChromeIosOrDesktop() {
          var ua = navigator.userAgent || ''
          // iOS Chrome uses CriOS (no "Chrome" token). Desktop uses Chrome.
          return (/CriOS/i.test(ua) || /Chrome/i.test(ua)) && !/Edg|OPR|EdgiOS/i.test(ua)
        }

        function showHangRecovery() {
          var hint = document.getElementById('cw-boot-hint')
          if (!hint) return
          hint.setAttribute('role', 'status')
          var chromeNote = isChromeIosOrDesktop()
            ? '<span style="display:block;margin-top:1rem;font-size:0.85em;opacity:0.75;line-height:1.45">Chrome tip: tap the lock icon → Cookies and site data → clear chronowalk.com, then use Open ChronoWalk. Safari can keep working on its own.</span>'
            : '<span style="display:block;margin-top:0.75rem;font-size:0.85em;opacity:0.7">Access stays on this device.</span>'
          hint.innerHTML =
            'Still loading…' +
            '<br /><br />' +
            '<a href="/?cw_clean=1" style="color:#f5efe3;text-decoration:underline">Open ChronoWalk</a>' +
            '<br /><br />' +
            '<a href="/rome/reset-shell?force=1" style="color:#f5efe3;opacity:0.8;text-decoration:underline;font-size:0.9em">Refresh the app shell</a>' +
            chromeNote
        }

        function scheduleHangWatchdog(ms) {
          window.setTimeout(function () {
            try {
              showHangRecovery()
            } catch (e) {}
          }, ms)
        }

        try {
          var params = new URLSearchParams(window.location.search || '')
          if (params.get('cw_clean') === '1') {
            localStorage.removeItem('cw-needs-shell-reset')
            localStorage.removeItem('cw-shell-reset-at')
            localStorage.setItem(SKIP_SW_KEY, '1')
            sessionStorage.removeItem('cw-boot-reload')
            sessionStorage.removeItem('cw-boot-pending')
            sessionStorage.removeItem('cw-chunk-reload')
            sessionStorage.removeItem('cw-sw-purge-reload')
            if (window.history && window.history.replaceState) {
              params.delete('cw_clean')
              var next = window.location.pathname
              var q = params.toString()
              window.history.replaceState(null, '', next + (q ? '?' + q : ''))
            }
          }
        } catch (e) {}

        // Quietly drop any SW registration without blocking module load.
        // Never delete Cache Storage during boot - that raced Chrome module fetches.
        // Never auto-navigate the document here - that recreated the Chrome recovery loop.
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) {
                reg.unregister()
              })
            })
          }
        } catch (e2) {}

        // Chrome often needs the manual escape sooner; Safari rarely hits this.
        scheduleHangWatchdog(isChromeIosOrDesktop() ? 4500 : 8000)
      })()
    </script>
