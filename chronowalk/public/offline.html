<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16130F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ChronoWalk — Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --obsidian: #16130f;
        --bone: #f5efe3;
        --muted: #a89f90;
        --ember: #e8a13c;
        --ink-800: #2a251f;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
        font-family: 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--obsidian);
        color: var(--bone);
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
      }

      main {
        width: min(28rem, 100%);
        border: 1px solid var(--ink-800);
        border-radius: 1.5rem;
        background: color-mix(in srgb, var(--obsidian) 88%, #2a251f);
        padding: 2rem 1.75rem;
        text-align: center;
      }

      .eyebrow {
        margin: 0;
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ember);
      }

      h1 {
        margin: 0.75rem 0 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 1.75rem;
        line-height: 1.2;
        font-weight: 600;
        color: var(--bone);
      }

      p {
        margin: 1rem 0 0;
        color: var(--muted);
        line-height: 1.6;
        font-size: 0.95rem;
      }

      button {
        margin-top: 1.5rem;
        width: 100%;
        min-height: 2.75rem;
        border: 0;
        border-radius: 0.75rem;
        background: var(--ember);
        color: var(--obsidian);
        font: inherit;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      button:focus-visible {
        outline: 2px solid rgba(232, 161, 60, 0.6);
        outline-offset: 2px;
      }

      .status {
        margin-top: 1rem;
        font-size: 0.8rem;
        color: var(--ember);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">ChronoWalk</p>
      <h1>You are offline</h1>
      <p>
        The connection dropped, but your tour shell is still available. Reconnect to load map tiles,
        fresh directions, and any media you have not opened yet. If you already downloaded your walk,
        open ChronoWalk from the home-screen icon.
      </p>
      <button type="button" id="retry">Try again</button>
      <p class="status" id="status" hidden>Back online — reopening ChronoWalk…</p>
    </main>
    <script>
      const retryButton = document.getElementById('retry')
      const status = document.getElementById('status')

      retryButton.addEventListener('click', () => {
        window.location.replace('/')
      })

      window.addEventListener('online', () => {
        status.hidden = false
        window.setTimeout(() => window.location.replace('/'), 600)
      })
    </script>
  </body>
</html>
