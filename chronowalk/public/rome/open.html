<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#16130F" />
    <title>ChronoWalk - Opening</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #16130f;
        color: #f5efe3;
        font: 500 1rem/1.5 system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
      }
      p {
        margin: 0;
        max-width: 22rem;
      }
      .sub {
        margin-top: 0.75rem;
        opacity: 0.7;
        font-size: 0.9rem;
        font-weight: 400;
      }
      .actions {
        margin-top: 1.25rem;
        display: grid;
        gap: 0.75rem;
        justify-items: center;
      }
      button.btn,
      a.btn {
        appearance: none;
        border: 1px solid rgba(245, 239, 227, 0.35);
        background: transparent;
        color: inherit;
        font: inherit;
        padding: 0.65rem 1rem;
        text-decoration: none;
        cursor: pointer;
      }
      .hidden {
        display: none !important;
      }
    </style>
    <script>
      ;(function () {
        // Denylisted bridge between reset-shell and /landing.
        // Continue must NOT jump straight to /landing while iOS may still reattach
        // a controller - that leaves "could not finish loading" with no progress.
        var RESET_AT_KEY = 'cw-shell-reset-at'
        var SKIP_SW_KEY = 'cw-skip-sw-once'
        var STABLE_MS = 2000
        var WAIT_MS = 12000
        var stuck = false
        try {
          stuck = new URLSearchParams(window.location.search).get('stuck') === '1'
        } catch (e) {}

        function goLanding() {
          try {
            window.location.assign('/landing?cw_bust=' + Date.now())
          } catch (e) {
            window.location.href = '/landing?cw_bust=' + Date.now()
          }
        }

        function setStatus(title, detail) {
          var status = document.getElementById('cw-open-status')
          var sub = document.getElementById('cw-open-sub')
          if (status) status.textContent = title
          if (sub && detail) sub.innerHTML = detail
        }

        function showActions() {
          var actions = document.getElementById('cw-open-actions')
          if (actions) actions.classList.remove('hidden')
        }

        function showNuclear() {
          setStatus(
            'One more step on this phone',
            'ChronoWalk is still blocked by an old saved copy of the site. Close every ChronoWalk tab, then clear <strong>Website Data</strong> for chronowalk.com (Safari: Settings → Safari → Advanced → Website Data → chronowalk.com → Remove; Chrome: lock icon → Cookies and site data → clear). Your purchase stays with your email - reopen the access link after. Access keys on this phone will need that link again.',
          )
          showActions()
        }

        function clearCachesAndWorkers() {
          var jobs = []
          if ('caches' in window) {
            jobs.push(
              caches.keys().then(function (names) {
                return Promise.all(
                  names.map(function (name) {
                    return caches.delete(name)
                  }),
                )
              }),
            )
          }
          if ('serviceWorker' in navigator) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  regs.map(function (reg) {
                    return reg.unregister()
                  }),
                )
              }),
            )
          }
          return Promise.all(jobs)
        }

        function readShellState() {
          if (!('serviceWorker' in navigator)) {
            return Promise.resolve({ controller: false, regs: 0 })
          }
          return navigator.serviceWorker.getRegistrations().then(function (regs) {
            return {
              controller: Boolean(navigator.serviceWorker.controller),
              regs: regs ? regs.length : 0,
            }
          })
        }

        function waitForStableClear(timeoutMs, stableMs) {
          var started = Date.now()
          var clearSince = 0
          return new Promise(function (resolve) {
            function tick() {
              readShellState()
                .then(function (state) {
                  var clear = !state.controller && state.regs === 0
                  if (clear) {
                    if (!clearSince) clearSince = Date.now()
                    if (Date.now() - clearSince >= stableMs) {
                      resolve(true)
                      return
                    }
                  } else {
                    clearSince = 0
                  }
                  if (Date.now() - started >= timeoutMs) {
                    resolve(false)
                    return
                  }
                  window.setTimeout(tick, 150)
                })
                .catch(function () {
                  resolve(!navigator.serviceWorker.controller)
                })
            }
            tick()
          })
        }

        function markReady() {
          try {
            localStorage.setItem(RESET_AT_KEY, String(Date.now()))
            localStorage.setItem(SKIP_SW_KEY, '1')
            localStorage.removeItem('cw-needs-shell-reset')
            sessionStorage.setItem('cw-boot-hang-redirect', '1')
            sessionStorage.setItem('cw-chunk-reload', 'rome-open')
          } catch (e) {}
        }

        function tryOpen() {
          setStatus('Opening ChronoWalk…', 'Waiting until this phone drops the old app shell.')
          return clearCachesAndWorkers()
            .catch(function () {})
            .then(function () {
              return waitForStableClear(WAIT_MS, STABLE_MS)
            })
            .then(function (ok) {
              if (!ok) {
                showNuclear()
                return
              }
              markReady()
              goLanding()
            })
        }

        try {
          localStorage.setItem(SKIP_SW_KEY, '1')
        } catch (e) {}

        window.__cwOpenRetry = function () {
          tryOpen()
        }

        window.__cwOpenReset = function () {
          window.location.assign('/rome/reset-shell?force=1&cw_bust=' + Date.now())
        }

        if (stuck) {
          showNuclear()
          clearCachesAndWorkers().catch(function () {})
        } else {
          tryOpen()
        }
      })()
    </script>
  </head>
  <body>
    <main>
      <div>
        <p id="cw-open-status">Opening ChronoWalk…</p>
        <p id="cw-open-sub" class="sub">
          Waiting until this phone drops the old app shell. Your access stays on this device unless you clear Website Data.
        </p>
        <div id="cw-open-actions" class="actions hidden">
          <button type="button" class="btn" onclick="window.__cwOpenRetry && window.__cwOpenRetry()">
            Try again
          </button>
          <button type="button" class="btn" onclick="window.__cwOpenReset && window.__cwOpenReset()">
            Refresh app shell again
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
