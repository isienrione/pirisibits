<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#16130F" />
    <title>ChronoWalk</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #16130f;
        color: #f5efe3;
        font: 500 1rem/1.5 system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
      }
      p {
        margin: 0;
        max-width: 22rem;
      }
      .sub {
        margin-top: 0.75rem;
        opacity: 0.7;
        font-size: 0.9rem;
        font-weight: 400;
      }
      .actions {
        margin-top: 1.5rem;
        display: grid;
        gap: 0.75rem;
        justify-items: center;
      }
      a.btn {
        appearance: none;
        border: 1px solid rgba(245, 239, 227, 0.35);
        background: transparent;
        color: inherit;
        font: inherit;
        padding: 0.75rem 1.1rem;
        text-decoration: none;
        min-width: 12rem;
      }
      a.btn-primary {
        background: #f5efe3;
        color: #16130f;
        border-color: #f5efe3;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <p>ChronoWalk is ready</p>
        <p class="sub">
          Tap Open ChronoWalk once. Do not use Refresh app shell - that screen can loop with this one.
        </p>
        <div class="actions">
          <!-- Real link only. No meta-refresh / JS redirect (those bounced into reset-shell). -->
          <a class="btn btn-primary" href="/?cw_clean=1">Open ChronoWalk</a>
        </div>
      </div>
    </main>
  </body>
</html>
