<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#16130F" />
    <!-- Real navigation fallback - works even if JS is broken or bouncing. -->
    <meta http-equiv="refresh" content="2;url=/landing" />
    <title>ChronoWalk</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #16130f;
        color: #f5efe3;
        font: 500 1rem/1.5 system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
      }
      p {
        margin: 0;
        max-width: 22rem;
      }
      .sub {
        margin-top: 0.75rem;
        opacity: 0.7;
        font-size: 0.9rem;
        font-weight: 400;
      }
      .actions {
        margin-top: 1.5rem;
        display: grid;
        gap: 0.75rem;
        justify-items: center;
      }
      a.btn {
        appearance: none;
        border: 1px solid rgba(245, 239, 227, 0.35);
        background: transparent;
        color: inherit;
        font: inherit;
        padding: 0.75rem 1.1rem;
        text-decoration: none;
        min-width: 12rem;
      }
      a.btn-primary {
        background: #f5efe3;
        color: #16130f;
        border-color: #f5efe3;
      }
    </style>
    <script>
      ;(function () {
        // Keep this page dumb. Auto-recovery bounce loops made travelers think
        // buttons did nothing. Prefer real links + a short meta refresh.
        try {
          localStorage.removeItem('cw-shell-reset-at')
          localStorage.setItem('cw-skip-sw-once', '1')
          localStorage.removeItem('cw-needs-shell-reset')
          sessionStorage.setItem('cw-boot-hang-redirect', '1')
        } catch (e) {}

        // Best-effort wipe - never block the link / meta refresh.
        try {
          if ('caches' in window) {
            caches.keys().then(function (names) {
              names.forEach(function (name) {
                caches.delete(name)
              })
            })
          }
        } catch (e) {}
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) {
                reg.unregister()
              })
            })
          }
        } catch (e) {}

        // If nothing is controlling this tab, leave immediately.
        try {
          if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) {
            window.setTimeout(function () {
              window.location.replace('/landing?cw_bust=' + Date.now())
            }, 250)
          }
        } catch (e) {
          window.location.replace('/landing?cw_bust=' + Date.now())
        }
      })()
    </script>
  </head>
  <body>
    <main>
      <div>
        <p>ChronoWalk is ready</p>
        <p class="sub">
          Tap below to open the site. After clearing site data, you do not need the refresh tools anymore.
        </p>
        <div class="actions">
          <a class="btn btn-primary" href="/landing">Open ChronoWalk</a>
          <a class="btn" href="/landing?cw_bust=1">Open with refresh</a>
        </div>
      </div>
    </main>
  </body>
</html>
