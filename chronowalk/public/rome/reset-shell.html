<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#16130F" />
    <title>ChronoWalk - Refreshing app shell</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #16130f;
        color: #f5efe3;
        font: 500 1rem/1.5 system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
      }
      p {
        margin: 0;
        max-width: 22rem;
      }
      .sub {
        margin-top: 0.75rem;
        opacity: 0.7;
        font-size: 0.9rem;
        font-weight: 400;
      }
    </style>
    <script>
      ;(function () {
        // Static escape hatch for poisoned PWA shells. Not part of the SPA.
        // Clears Cache Storage + service workers only - access keys and tour
        // progress in localStorage / IndexedDB are preserved.
        //
        // Critical on iOS: unregister() can resolve while navigator.serviceWorker
        // .controller is still set. Navigating then re-serves the poisoned shell
        // under the old controller → module scripts fail → index.html cooldown
        // suppresses recovery → permanent "Loading ChronoWalk…".
        //
        // Cooldown retries must ALSO wait for controller clear - otherwise a second
        // visit to reset-shell within 2 minutes just bounces to /landing while still
        // controlled and the user stays stuck on Loading ChronoWalk.
        var RESET_AT_KEY = 'cw-shell-reset-at'
        var COOLDOWN_MS = 2 * 60 * 1000
        var CONTROLLER_WAIT_MS = 2500
        var now = Date.now()
        var force = false
        try {
          force = new URLSearchParams(window.location.search).get('force') === '1'
        } catch (e) {}

        function goLanding() {
          // assign (not replace): iOS often drops controlled navigations with replace.
          try {
            window.location.assign('/landing?cw_bust=' + Date.now())
          } catch (e) {
            window.location.href = '/landing?cw_bust=' + Date.now()
          }
        }

        function waitForControllerGone(timeoutMs) {
          if (!('serviceWorker' in navigator)) {
            return Promise.resolve(true)
          }
          var started = Date.now()
          return new Promise(function (resolve) {
            function tick() {
              var controller = navigator.serviceWorker.controller
              navigator.serviceWorker
                .getRegistrations()
                .then(function (regs) {
                  if (!controller && (!regs || regs.length === 0)) {
                    resolve(true)
                    return
                  }
                  if (Date.now() - started >= timeoutMs) {
                    resolve(!navigator.serviceWorker.controller)
                    return
                  }
                  window.setTimeout(tick, 100)
                })
                .catch(function () {
                  resolve(!navigator.serviceWorker.controller)
                })
            }
            tick()
          })
        }

        function clearCachesAndWorkers() {
          var jobs = []
          if ('caches' in window) {
            jobs.push(
              caches.keys().then(function (names) {
                return Promise.all(
                  names.map(function (name) {
                    return caches.delete(name)
                  }),
                )
              }),
            )
          }
          if ('serviceWorker' in navigator) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  regs.map(function (reg) {
                    return reg.unregister()
                  }),
                )
              }),
            )
          }
          return Promise.all(jobs)
        }

        function finishToLanding() {
          return waitForControllerGone(CONTROLLER_WAIT_MS)
            .then(function () {
              return new Promise(function (resolve) {
                window.setTimeout(resolve, 200)
              })
            })
            .then(goLanding)
        }

        var inCooldown = false
        try {
          var last = parseInt(localStorage.getItem(RESET_AT_KEY) || '0', 10)
          inCooldown = !force && last && now - last < COOLDOWN_MS
          localStorage.setItem('cw-skip-sw-once', '1')
          localStorage.removeItem('cw-needs-shell-reset')
          if (!inCooldown) {
            localStorage.setItem(RESET_AT_KEY, String(now))
            // Keep cw-chunk-reload / cw-boot-reload set so automatic recovery
            // cannot immediately bounce back into this page.
            sessionStorage.setItem('cw-chunk-reload', 'reset-shell')
            sessionStorage.removeItem('cw-boot-pending')
          }
        } catch (e) {}

        // Always wipe + wait (even during cooldown). Skipping the wait was leaving
        // iOS on Loading ChronoWalk after a second reset-shell tap.
        clearCachesAndWorkers()
          .catch(function () {})
          .then(finishToLanding)
      })()
    </script>
  </head>
  <body>
    <main>
      <div>
        <p>Refreshing ChronoWalk…</p>
        <p class="sub">Your access and progress stay on this device.</p>
      </div>
    </main>
  </body>
</html>
