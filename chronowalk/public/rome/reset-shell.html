<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#16130F" />
    <title>ChronoWalk - Refreshing app shell</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #16130f;
        color: #f5efe3;
        font: 500 1rem/1.5 system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
      }
      p {
        margin: 0;
        max-width: 22rem;
      }
      .sub {
        margin-top: 0.75rem;
        opacity: 0.7;
        font-size: 0.9rem;
        font-weight: 400;
      }
      .actions {
        margin-top: 1.25rem;
        display: grid;
        gap: 0.75rem;
        justify-items: center;
      }
      a.btn,
      button.btn {
        appearance: none;
        border: 1px solid rgba(245, 239, 227, 0.35);
        background: transparent;
        color: inherit;
        font: inherit;
        padding: 0.65rem 1rem;
        text-decoration: none;
        cursor: pointer;
      }
      .hidden {
        display: none !important;
      }
    </style>
    <script>
      ;(function () {
        // Static escape hatch for poisoned PWA shells. Not part of the SPA.
        // Clears Cache Storage + service workers only - access keys and tour
        // progress in localStorage / IndexedDB are preserved.
        //
        // Critical on iOS: unregister() can resolve while navigator.serviceWorker
        // .controller is still set. Navigating then re-serves the poisoned shell
        // under the old controller → module scripts fail → index.html cooldown
        // suppresses recovery → permanent "Loading ChronoWalk…".
        //
        // NEVER navigate to /landing while controller is still set. Previous
        // fixes waited ~2.5s then navigated anyway - that was still insufficient
        // on iOS. Instead: wait longer, reload this denylisted page once to drop
        // the controller client, and only then go to /landing. If still stuck,
        // show a manual continue (do not poison /landing).
        var RESET_AT_KEY = 'cw-shell-reset-at'
        var SKIP_SW_KEY = 'cw-skip-sw-once'
        var WAIT_RELOAD_KEY = 'cw-reset-shell-wait-reload'
        var COOLDOWN_MS = 2 * 60 * 1000
        var CONTROLLER_WAIT_MS = 10000
        var now = Date.now()
        var force = false
        try {
          force = new URLSearchParams(window.location.search).get('force') === '1'
        } catch (e) {}

        function goLanding() {
          // assign (not replace): iOS often drops controlled navigations with replace.
          try {
            window.location.assign('/landing?cw_bust=' + Date.now())
          } catch (e) {
            window.location.href = '/landing?cw_bust=' + Date.now()
          }
        }

        function waitForControllerGone(timeoutMs) {
          if (!('serviceWorker' in navigator)) {
            return Promise.resolve(true)
          }
          var started = Date.now()
          return new Promise(function (resolve) {
            function tick() {
              navigator.serviceWorker
                .getRegistrations()
                .then(function (regs) {
                  var controller = navigator.serviceWorker.controller
                  var clear = !controller && (!regs || regs.length === 0)
                  if (clear) {
                    resolve(true)
                    return
                  }
                  if (Date.now() - started >= timeoutMs) {
                    resolve(
                      !navigator.serviceWorker.controller && (!regs || regs.length === 0),
                    )
                    return
                  }
                  window.setTimeout(tick, 100)
                })
                .catch(function () {
                  resolve(!navigator.serviceWorker.controller)
                })
            }
            tick()
          })
        }

        function clearCachesAndWorkers() {
          var jobs = []
          if ('caches' in window) {
            jobs.push(
              caches.keys().then(function (names) {
                return Promise.all(
                  names.map(function (name) {
                    return caches.delete(name)
                  }),
                )
              }),
            )
          }
          if ('serviceWorker' in navigator) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  regs.map(function (reg) {
                    return reg.unregister()
                  }),
                )
              }),
            )
          }
          return Promise.all(jobs)
        }

        function markResetCompleted() {
          try {
            localStorage.setItem(RESET_AT_KEY, String(Date.now()))
            localStorage.setItem(SKIP_SW_KEY, '1')
            localStorage.removeItem('cw-needs-shell-reset')
            sessionStorage.setItem('cw-chunk-reload', 'reset-shell')
            sessionStorage.removeItem('cw-boot-pending')
            sessionStorage.removeItem(WAIT_RELOAD_KEY)
          } catch (e) {}
        }

        function showStuckUi() {
          var status = document.getElementById('cw-reset-status')
          var sub = document.getElementById('cw-reset-sub')
          var actions = document.getElementById('cw-reset-actions')
          if (status) {
            status.textContent = 'Almost done - one more step'
          }
          if (sub) {
            sub.innerHTML =
              'This browser is still holding an old app shell. Close every ChronoWalk tab (and the Home Screen icon if you use it), then tap Continue. Your access stays on this device.'
          }
          if (actions) actions.classList.remove('hidden')
        }

        function finishToLanding() {
          return waitForControllerGone(CONTROLLER_WAIT_MS).then(function (gone) {
            if (gone) {
              markResetCompleted()
              return new Promise(function (resolve) {
                window.setTimeout(resolve, 200)
              }).then(goLanding)
            }

            // Still controlled after unregister: reload THIS denylisted document so
            // the next document is not a controlled client. At most once per tab.
            try {
              if (sessionStorage.getItem(WAIT_RELOAD_KEY) !== '1') {
                sessionStorage.setItem(WAIT_RELOAD_KEY, '1')
                window.location.reload()
                return
              }
            } catch (e) {}

            // Do NOT navigate to /landing while controlled - that re-poisons the shell.
            showStuckUi()
          })
        }

        try {
          localStorage.setItem(SKIP_SW_KEY, '1')
          localStorage.removeItem('cw-needs-shell-reset')
          // force=1: hard-clear cooldown so a failed prior wipe cannot suppress
          // index.html recovery / leave Loading ChronoWalk stuck.
          if (force) {
            localStorage.removeItem(RESET_AT_KEY)
          }
        } catch (e) {}

        // Always wipe + wait. Skipping the wait left iOS on Loading ChronoWalk.
        clearCachesAndWorkers()
          .catch(function () {})
          .then(finishToLanding)

        window.__cwResetShellContinue = function () {
          clearCachesAndWorkers()
            .catch(function () {})
            .then(function () {
              return waitForControllerGone(CONTROLLER_WAIT_MS)
            })
            .then(function (gone) {
              if (gone) {
                markResetCompleted()
                goLanding()
                return
              }
              showStuckUi()
            })
        }
      })()
    </script>
  </head>
  <body>
    <main>
      <div>
        <p id="cw-reset-status">Refreshing ChronoWalk…</p>
        <p id="cw-reset-sub" class="sub">Your access and progress stay on this device.</p>
        <div id="cw-reset-actions" class="actions hidden">
          <button type="button" class="btn" onclick="window.__cwResetShellContinue && window.__cwResetShellContinue()">
            Continue
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
