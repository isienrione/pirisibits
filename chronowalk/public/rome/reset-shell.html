<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#16130F" />
    <title>ChronoWalk - Refreshing app shell</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #16130f;
        color: #f5efe3;
        font: 500 1rem/1.5 system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
      }
      p {
        margin: 0;
        max-width: 22rem;
      }
      .sub {
        margin-top: 0.75rem;
        opacity: 0.7;
        font-size: 0.9rem;
        font-weight: 400;
      }
      .actions {
        margin-top: 1.25rem;
        display: grid;
        gap: 0.75rem;
        justify-items: center;
      }
      a.btn,
      button.btn {
        appearance: none;
        border: 1px solid rgba(245, 239, 227, 0.35);
        background: transparent;
        color: inherit;
        font: inherit;
        padding: 0.65rem 1rem;
        text-decoration: none;
        cursor: pointer;
      }
      a.btn-primary {
        background: #f5efe3;
        color: #16130f;
        border-color: #f5efe3;
      }
      .hidden {
        display: none !important;
      }
    </style>
    <script>
      ;(function () {
        // Wipe caches/SW only. NEVER auto-navigate - JS redirects caused
        // blink loops with the open bridge. Continue is a real link.
        var RESET_AT_KEY = 'cw-shell-reset-at'
        var SKIP_SW_KEY = 'cw-skip-sw-once'

        try {
          localStorage.setItem(SKIP_SW_KEY, '1')
          localStorage.removeItem('cw-needs-shell-reset')
          localStorage.removeItem(RESET_AT_KEY)
          sessionStorage.setItem('cw-boot-hang-redirect', '1')
        } catch (e) {}

        function clearCachesAndWorkers() {
          var jobs = []
          if ('caches' in window) {
            jobs.push(
              caches.keys().then(function (names) {
                return Promise.all(
                  names.map(function (name) {
                    return caches.delete(name)
                  }),
                )
              }),
            )
          }
          if ('serviceWorker' in navigator) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  regs.map(function (reg) {
                    return reg.unregister()
                  }),
                )
              }),
            )
          }
          return Promise.all(jobs)
        }

        function showContinue() {
          var status = document.getElementById('cw-reset-status')
          var sub = document.getElementById('cw-reset-sub')
          var actions = document.getElementById('cw-reset-actions')
          if (status) status.textContent = 'Ready when you are'
          if (sub) {
            sub.textContent =
              'Tap Open ChronoWalk below. Leave this tab open until the site appears - do not reopen the refresh tools.'
          }
          if (actions) actions.classList.remove('hidden')
        }

        // Best-effort wipe with a hard timeout so UI is never stuck on Refreshing…
        var done = false
        function finish() {
          if (done) return
          done = true
          showContinue()
        }
        window.setTimeout(finish, 2000)
        clearCachesAndWorkers()
          .catch(function () {})
          .then(finish)
      })()
    </script>
  </head>
  <body>
    <main>
      <div>
        <p id="cw-reset-status">Refreshing ChronoWalk…</p>
        <p id="cw-reset-sub" class="sub">
          Clearing the old app shell on this phone. Your access stays on this device.
        </p>
        <div id="cw-reset-actions" class="actions hidden">
          <a class="btn btn-primary" href="/landing?cw_clean=1">Open ChronoWalk</a>
        </div>
      </div>
    </main>
  </body>
</html>
