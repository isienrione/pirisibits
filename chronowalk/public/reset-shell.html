<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>ChronoWalk - Refreshing app shell</title>
    <script>
      // Legacy path: Cloudflare Pretty URLs + older service workers may still
      // intercept /reset-shell. Send everyone to /rome/… which is denylisted.
      // Preserve ?force=1 so stuck-loading escape hatches still work.
      ;(function () {
        var params = new URLSearchParams(window.location.search || '')
        params.set('cw_bust', String(Date.now()))
        window.location.replace('/rome/reset-shell?' + params.toString())
      })()
    </script>
  </head>
  <body style="margin:0;background:#16130f;color:#f5efe3;font:500 1rem/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh">
    <p>Refreshing ChronoWalk…</p>
  </body>
</html>
